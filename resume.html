<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Temirlan Kakishev — Resume. Switch roles and language (EN/RU)."
    />
    <title>Temirlan Kakishev — Resume</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <script>
      (function () {
        var stored = localStorage.getItem("theme");
        var dark =
          stored === "dark" ||
          (!stored && window.matchMedia("(prefers-color-scheme: dark)").matches);
        if (dark) document.documentElement.setAttribute("data-theme", "dark");
      })();
    </script>
  </head>
  <body class="resume-page is-loading">
    <a
      href="#resume-main"
      class="sr-only focus:not-sr-only focus:absolute focus:left-4 focus:top-4 focus:z-[70] focus:rounded-lg focus:bg-ink focus:px-4 focus:py-2 focus:text-paper"
    >
      Skip to content
    </a>

    <header id="site-header" class="site-header">
      <a href="./" class="nav-brand">Temirlan</a>
      <div class="nav-lang" role="group" aria-label="Language">
        <button type="button" class="nav-lang-chip" data-lang="en" aria-pressed="true">EN</button>
        <button type="button" class="nav-lang-chip" data-lang="ru" aria-pressed="false">RU</button>
      </div>
      <button
        id="theme-toggle"
        type="button"
        class="nav-theme-btn"
        aria-label="Switch to dark mode"
        title="Dark mode"
      >
        <svg class="theme-icon theme-icon-sun h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <circle cx="12" cy="12" r="4" />
          <path stroke-linecap="round" d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41" />
        </svg>
        <svg class="theme-icon theme-icon-moon h-4 w-4" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" />
        </svg>
      </button>
      <button
        id="menu-toggle"
        type="button"
        class="nav-menu-btn"
        aria-expanded="false"
        aria-controls="menu-overlay"
        aria-label="Open menu"
      >
        <svg class="h-4 w-4" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <circle cx="5" cy="12" r="1.6" />
          <circle cx="12" cy="12" r="1.6" />
          <circle cx="19" cy="12" r="1.6" />
        </svg>
      </button>
    </header>

    <div id="menu-overlay" class="menu-overlay" aria-hidden="true" role="dialog" aria-label="Navigation">
      <div class="menu-overlay-bar">
        <span class="menu-overlay-brand">Temirlan</span>
        <button
          id="menu-close"
          type="button"
          class="menu-close-btn"
          aria-label="Close menu"
        >
          <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
          </svg>
        </button>
      </div>
      <nav class="flex flex-1 flex-col justify-center gap-1 px-5 sm:px-8 lg:px-12" aria-label="Main">
        <a href="./#hero-section" class="menu-link" style="transition-delay: 40ms"><span>Home</span></a>
        <a href="./#about" class="menu-link" style="transition-delay: 80ms"><span>About Me</span></a>
        <a href="#resume-main" class="menu-link" style="transition-delay: 120ms"><span>Resume</span></a>
        <a href="./#services" class="menu-link" style="transition-delay: 160ms"><span>Services</span></a>
        <a href="./#work" class="menu-link" style="transition-delay: 200ms"><span>Works</span></a>
        <a href="./#contact" class="menu-link" style="transition-delay: 240ms"><span>Contact</span></a>
      </nav>
      <div class="px-5 pb-8 sm:px-8">
        <a href="mailto:ZirveyDev@gmail.com" class="text-sm text-paper/60 transition-opacity hover:text-paper">
          ZirveyDev@gmail.com
        </a>
      </div>
    </div>

    <main id="resume-main" class="resume-shell">
      <header class="resume-hero">
        <p class="resume-kicker" data-i18n="kicker">Resume</p>
        <h1 class="resume-name">Temirlan Kakishev</h1>
        <p id="resume-position" class="resume-position"></p>
        <div id="resume-contact" class="resume-contact" aria-label="Contact"></div>
      </header>

      <div class="resume-roles-wrap">
        <p class="resume-roles-label" data-i18n="rolesLabel">Version</p>
        <nav class="resume-roles" id="resume-roles" aria-label="Resume version"></nav>
      </div>

      <div id="resume-content" class="resume-content"></div>
    </main>

    <script type="module" src="/src/resume.js"></script>
  </body>
</html>
